[project]
name = "erp-sandbox-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
erp-agent = "erp_agent.api.server:main"

[project.optional-dependencies]
dev = ["ruff>=0.9", "mypy>=1.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
erp_agent = ["api/static/*", "prompts/*.txt"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/erp_agent"]
