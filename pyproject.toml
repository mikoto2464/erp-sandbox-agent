[project]
name = "erp-sandbox-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.4,<2",
    "langchain-openai>=1.7.0,<2",
    "langchain-anthropic>=1.7.5,<2",
    "langchain-google-genai>=4.4.1,<5",
    "langchain-ollama>=1.1.0,<2",
    "socksio>=1.0.0,<2",
    "pdfplumber>=0.11,<0.12",
    "xlrd>=2.0.1,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
erp-agent = "erp_agent.api.server:main"

[project.optional-dependencies]
dev = ["ruff>=0.9", "mypy>=1.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
erp_agent = ["api/static/*", "prompts/*.txt"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/erp_agent"]
